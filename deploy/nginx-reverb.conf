# DR-PHARMA — Reverb WebSocket reverse proxy snippet
# À inclure dans le server block HTTPS principal (ws.drpharma.cm ou /app/* sur api.drpharma.cm)
#
# Pré-requis : `php artisan reverb:start --host=127.0.0.1 --port=8080` via systemd
# (voir deploy/drpharma-reverb.service)

# Sous-domaine dédié recommandé : ws.drpharma.cm
server {
    listen 443 ssl http2;
    server_name ws.drpharma.cm;

    ssl_certificate     /etc/letsencrypt/live/ws.drpharma.cm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ws.drpharma.cm/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # WebSocket (toutes les routes Reverb : /app/*, /apps/*)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived WS — éviter timeout
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 75s;

        # Désactiver buffering pour latence min
        proxy_buffering off;
    }
}
